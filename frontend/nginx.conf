server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Default is 1MB, well under the backend's own 300MB per-file limit
    # (see MAX_FILE_SIZE in backend/src/routes/homework.ts) — without this,
    # nginx rejects any upload over 1MB with a bare 413 before it ever
    # reaches Express/multer.
    client_max_body_size 300m;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Authorization forwards through proxy_pass by default — no directive needed.
        # Default is 60s — too short for a large upload over a slow connection.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
